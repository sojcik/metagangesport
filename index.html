<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaGang - Taktický Rozcestník</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .maps-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }

        .map-card {
            position: relative;
            width: 350px;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #0f3460;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            /* Zástupný obrázek odstraněn, tahá se to z HTML u každé mapy zvlášť */
            background-color: #112233; 
            background-size: cover;
            background-position: center;
            transition: transform 0.2s;
        }

        .map-card:hover {
            transform: translateY(-5px);
            border-color: #e94560;
        }

        .map-name {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            transition: opacity 0.3s;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 52, 96, 0.9);
            display: flex;
            flex-direction: column; /* Rozdělí kontejner na řádky pod sebou */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .map-card:hover .overlay {
            opacity: 1;
        }
        
        .map-card:hover .map-name {
            opacity: 0;
        }

        /* Kontejner pro spodní A/B část */
        .bottom-half {
            display: flex;
            flex: 1;
            width: 100%;
        }

        /* Univerzální vzhled pro všechna 3 tlačítka */
        .side-link {
            flex: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 36px; /* Zmenšeno z 48px, aby to nebylo přeplácané */
            font-weight: bold;
            transition: background-color 0.2s;
        }

        /* Hover efekty pro jednotlivé sekce */
        .side-link.ct-site:hover {
            background-color: rgba(52, 152, 219, 0.7); /* Modrá */
        }
        .side-link.a-site:hover {
            background-color: rgba(233, 69, 96, 0.7); /* Červená */
        }
        .side-link.b-site:hover {
            background-color: rgba(46, 204, 113, 0.7); /* Zelená */
        }

        /* Dělící čáry */
        .horizontal-divider {
            width: 100%;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .vertical-divider {
            width: 2px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.2);
        }

    </style>
</head>
<body>

    <h1>MetaGang Taktiky</h1>

    <div class="maps-grid">
        
        <!-- KARTA MAPY NUKE -->
        <div class="map-card" style="background-image: url('img/nuke.png');">
            <div class="map-name">NUKE</div>
            
            <div class="overlay">
                <!-- HORNÍ POLOVINA: CT -->
                <a href="strats/nuke-ct.html" class="side-link ct-site">CT</a>
                
                <div class="horizontal-divider"></div>
                
                <!-- SPODNÍ POLOVINA: A / B -->
                <div class="bottom-half">
                    <a href="strats/nuke-a.html" class="side-link a-site">A</a>
                    <div class="vertical-divider"></div>
                    <a href="strats/nuke-b.html" class="side-link b-site">B</a>
                </div>
            </div>
        </div>

        <!-- Příklad pro přidání další mapy v budoucnu:
        <div class="map-card" style="background-image: url('img/mirage.png');">
            <div class="map-name">MIRAGE</div>
            ...
        </div>
        -->

    </div>

</body>
</html>
